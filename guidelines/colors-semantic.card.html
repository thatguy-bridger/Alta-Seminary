<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Colors" subtitle="Success, warning, error, info — used sparingly for status" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:150px;font-family:Arial,sans-serif;padding:10px;background:var(--surface-page)">
<div style="flex:1;background:var(--color-success);border-radius:8px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">success</div>
<div style="flex:1;background:var(--color-warning);border-radius:8px;display:flex;align-items:flex-end;padding:10px;color:#1A1814;font-size:12px">warning</div>
<div style="flex:1;background:var(--color-error);border-radius:8px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">error</div>
<div style="flex:1;background:var(--color-info);border-radius:8px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">info</div>
</div>
