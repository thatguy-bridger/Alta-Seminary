<!-- @dsCard group="Brand" viewport="700x230" name="Light / Dark" subtitle="Tokens flip under [data-theme=dark]; Auto follows the OS via theme-init.js" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:230px;font-family:Arial,sans-serif">
<div style="flex:1;background:var(--surface-page);padding:20px;display:flex;flex-direction:column;gap:12px">
<div style="font-family:var(--font-serif);font-size:20px;color:var(--text-primary)">Light</div>
<div class="card" style="padding:14px;display:flex;gap:8px"><span class="badge badge-success">Present</span><span class="badge badge-warning">Excused</span></div>
<button class="btn btn-primary" style="width:fit-content">Primary</button>
</div>
<div data-theme="dark" style="flex:1;background:var(--surface-page);padding:20px;display:flex;flex-direction:column;gap:12px">
<div style="font-family:var(--font-serif);font-size:20px;color:var(--text-primary)">Dark</div>
<div class="card" style="padding:14px;display:flex;gap:8px"><span class="badge badge-success">Present</span><span class="badge badge-warning">Excused</span></div>
<button class="btn btn-primary" style="width:fit-content">Primary</button>
</div>
</div>
