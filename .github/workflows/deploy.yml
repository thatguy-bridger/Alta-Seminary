name: Deploy to GitHub Pages

# The site itself now lives on Vercel (server-rendered, see astro.config.mjs
# and the "instant updates" migration) -- this old GitHub Pages URL no
# longer builds the Astro app at all (that stopped making sense once output
# switched to server mode). It just deploys a single static redirect page,
# so anyone still holding the old link lands on the real site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir -p redirect-site
          cat > redirect-site/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=https://alta-seminary-omega.vercel.app/" />
            <link rel="canonical" href="https://alta-seminary-omega.vercel.app/" />
            <title>Alta Seminary</title>
          </head>
          <body>
            <p>This site has moved. <a href="https://alta-seminary-omega.vercel.app/">Continue to the new site</a>.</p>
            <script>window.location.replace("https://alta-seminary-omega.vercel.app/");</script>
          </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
